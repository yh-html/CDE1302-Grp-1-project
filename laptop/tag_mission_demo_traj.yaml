# SMOOTH-TRAJECTORY VARIANT of tag_mission_demo.yaml: flies one continuous slow path (no stop at waypoints) so the camera sees every tag.
# Speed 0.144 m/s (0.12 + 20%, 10 Nov). Prof/TA advice was 0.12. Tune trajectory.speed_mps down if tags are still missed.
# DEMO CONFIG: official search area, returns and lands as soon as expected_tags (3) are found (saves completion time).
# Same as tag_mission.yaml except stop_when_all_found: true. Measure camera offsets and latency before flying.
# Configuration for laptop/run_tag_mission.py (CDE1302 mini-project).
#
# All distances in metres, in the drone's LOCAL frame: origin at the takeoff
# point, x = North (forward at takeoff), y = East.  Values marked PLACEHOLDER or
# ASSUMED must be replaced with measurements before the demonstration.

# From "CDE1302-Mini Project-Flying Area.pdf" (Studio 1, E2A): search area 3.6 m x 3.15 m,
# 0.45 m beyond the 0.9 m launch square, launch point at its centre, 1.8 m of search area to
# the left of the launch line and 1.35 m to the right, three tags. The drone starts facing
# the search area (x forward, y right; confirmed by the team). Confirm the exact start position
# with the examiner on the day.
#
# PDF diagram ("CDE1302-Mini Project-Flying Area.pdf"), drone frame (origin = launch-square
# centre, +x forward, +y right):
#   six possible tag spots, 0.45 m inside the search area edges:
#     x = 1.35, 2.70, 4.05 and y = -1.35 (left row), +0.90 (right row)
#   flight boundary 5.4 m x 4.5 m with the launch square against its back edge: x = -0.45 .. 4.95
# The team sketch ("photos of arena/drone arena.SLDPRT", 10 Nov) put the spots at x = 1.5, 2.85,
# 4.2 (+0.15 m) and y = -1.35, +0.95; being RE-MEASURED with a tape. Until then the PDF is used.
#   arena walls (sketch): x = -1.5 .. 6.2, y = -2.5 .. 2.5 (7.7 m x 5 m), see arena_walls below.
search_area:
  min_x: 0.9
  max_x: 4.5
  min_y: -1.8
  max_y: 1.35

# Walls of the arena (MEASURED, same sketch). Both fences are cut back to stay
# mission.wall_clearance_m inside these; the live map draws them.
arena_walls:
  min_x: -1.5
  max_x: 6.2
  min_y: -2.5
  max_y: 2.5


# The six possible tag spots from the Flying Area PDF (local frame). Used to slow the
# trajectory where the camera can see a spot (trajectory.slow_speed_mps). Re-measure:
# the team sketch had them 0.15 m further forward (x = 1.5, 2.85, 4.2).
tag_spots:
  - [1.35, -1.35]
  - [2.70, -1.35]
  - [4.05, -1.35]
  - [1.35, 0.90]
  - [2.70, 0.90]
  - [4.05, 0.90]

sweep:
  # Two lanes, one straight down each row of tag spots (y = -1.35 and +0.90, x = 1.35..4.05):
  # 2.25 m apart and 0.45 m in from the edges, exactly where the PDF spots are. In the
  # simulator this found all 3 tags for all 20 spot combinations, 12.1 m / about 85 s.
  # It assumes the tags are ON the marked spots; for tags anywhere use 0.8 / 0.3 (5 lanes).
  lane_spacing_m: 2.25
  edge_margin_m: 0.45
  lane_offset_m: 0.0      # shift both lanes outwards (away from the area centre) by this much, to fly
                          # beside the spots, not over them (e.g. a tag boxed in by foam blocks the
                          # rangefinder could react to). 0.0 = straight over the spots. Up to 0.55
                          # stays inside the soft fence, but keep it small: the camera sees ~0.66 m
                          # either side and the drone drifts ~0.2 m.
  # Keep the downward rangefinder off every tag spot: a 0.15 m foam block under it made PX4
  # (height from the rangefinder only, baro off) reject the range data, climb to ~1 m and reset
  # its position (17:50 flight, PX4 log 67). Blocks and tags can be on any of the 6 spots, so the
  # path detours round all of them: in line to 0.20 m short of a spot (the camera sees it from
  # there), 0.45 m sideways towards the centre, past it, back onto the lane after it.
  far_end_back_m: 0.0     # (0.25 with avoid_overfly) lanes end this far short of the far spots
  avoid_overfly: false    # OFF since 10 Nov: PX4 now has EKF2_BARO_CTRL=1, EKF2_RNG_NOISE=0.05 and a
                          # hover + manual pass over the block was clean. Flying straight over the
                          # spots finds a boxed tag far better (sim 34/36 vs 26/36). Set true to detour.
  overfly_before_m: 0.25  # 0.08 m clear of a block's back wall (it reaches 0.17 m from the tag); the
                          # camera sees a boxed tag over a 0.15 m wall only from <= ~0.30 m short at 0.5 m height
  overfly_after_m: 0.35   # rejoin the lane 0.18 m past the block's far edge
  overfly_side_m: 0.45
  lane_axis: x            # lanes run along x (forward); "y" runs them sideways
  entry: left             # fly sideways (left) from the start to the first lane, then turn up it.
                          # right = rightmost lane first, lateral = nearest side, direct = old diagonal
  return_leg: lateral     # come back down the last lane to level with the start, then sideways home
                          # (direct = old diagonal)

# Where the camera sits on the drone and how it is tilted.  This sets the tag
# localisation error (15% of the marks): measure it on the assembled drone.
# PLACEHOLDER: from the CAD of the stock-parts CameraHolder_TPU (codex/stock_mounts,
# output/reports/GEOMETRY_BRIEF.md), NOT measured on the printed drone. It assumes the
# lens is centred on the pocket, a 32 mm standoff length (assumed) and the FC hanging
# 5 mm under the frame (body origin = FC centre). Measure the real lens position
# on the assembled drone and replace these three offsets.
# 11 Nov: camera moved to look straight down (parallel to the ground). Re-measure the three
# offsets below on the new mount: fwd_offset_m also sets where known_tags mode hovers.
camera:
  pitch_deg: 90.0         # camera parallel to the ground, looking straight down (was 45 until 11 Nov)
  hfov_deg: 91.0          # field of view, firmware calibration (main/at_detect.c)
  vfov_deg: 82.0
  fwd_offset_m: 0.070     # lens forward of the drone body origin
  right_offset_m: 0.0
  down_offset_m: 0.008    # lens below the body origin (0.013 if measured from the frame underside plane)

detection:
  max_pose_err: 0.5       # firmware pose reprojection error limit (at_detect.c)
  max_range_m: 3.0        # ASSUMED. Ignore tags farther than this (poor depth accuracy)
  min_view_elevation_deg: 30.0   # ASSUMED. Floor tags seen flatter than this will not decode/localise well
  latency_s: 0.0          # ASSUMED. Delay between the camera frame and the packet; measure it
  update_threshold_m: 0.2 # print TAG_UPDATED when the fused position moves more than this
  id_max: 21              # ignore IDs above this (16h5 false positives); course tags are 0-21
  rescue_margin: 70       # firmware drops tags with hamming>=2 even at high margin; keep them if margin >= this
  rescue_max_hamming: 3
  expected_tags: 3        # Flying Area PDF: three tags
  min_frames: 3           # a tag counts as found only after this many distinct camera frames
                          # (10 Nov flight: tag 2 misread once as 14 ended the sweep early)
  merge_radius_m: 0.5     # an ID this close to a stronger tag is a misread of it, not a new tag
  settle_s: 4.0           # hover this long after the last tag is found, to average more sightings
  stop_when_all_found: true    # true: return as soon as expected_tags are found

mission:
  # ASSUMED 0.2. The real speed is PX4's MPC_XY_VEL_MAX on the flight controller (waypoints/
  # WAYPOINT_FLIGHT_TEST_GUIDE.md says about 0.2 m/s); the firmware's NAV_CRUISE_SPEED_MS is NOT
  # used for control. Measure it with analyze_flight.py. Used here only for timeouts and the ETA.
  cruise_speed_mps: 0.20
  altitude_m: 0.5         # firmware CRUISE_ALT_M (main/main.c); used for the sweep planning and the sim
  takeoff_wait_s: 12.0    # as in laptop/TEST_GUIDE.md
  arrival_radius_m: 0.25  # firmware NAV_ARRIVE_RADIUS_M
  min_leg_timeout_s: 15.0
  max_mission_s: 600.0    # stop searching after this long, then return and land
  soft_fence_margin_m: 0.3   # past the search area by this: hold, fly back to start, land (before the hard fence)
                             # was 0.15: the sideways legs run along x = 0 and a 0.18 m drift back tripped it (10 Nov 17:47)
  geofence_margin_m: 0.45 # land if outside the search area plus this; 0.45 puts the hard fence
                          # exactly on the PDF flight boundary front (4.5+0.45 = 4.95) and back
                          # (0-0.45 = launch-square back edge). Was 0.5 (reached x 5.15 / 5.0).
  wall_clearance_m: 0.5   # ...but never let the hard geofence come closer than this to arena_walls
  stale_timeout_s: 3.0    # land if telemetry is older than this
  connect_timeout_s: 30.0
  land_wait_s: 8.0
  max_consecutive_misses: 3
  output_dir: mission_logs   # relative to laptop/

# Used only with --simulate: tags on the floor, local frame.
simulation:
  noise_m: 0.02           # Gaussian noise on the camera-frame translation
  takeoff_s: 8.0
  tags:                     # three of the six PDF spots; IDs as seen on the 10 Nov flights
    2: [1.35, -1.35]
    4: [2.7, 0.9]
    6: [4.05, 0.9]

# Smooth trajectory mode. The ESP32 plays the whole path on its own 20 Hz clock; PX4 must be in Offboard
# (the mission command puts it there). To abort by hand: flip the RC mode switch to Position, then land.
trajectory:
  enabled: true
  speed_mps: 0.144       # peak speed (was 0.12; +20% on 10 Nov); slower in curves and at start/end
  corner_radius_m: 0.35  # rounding of lane turns
  accel_mps2: 0.08
  # Slow down where the camera can see a tag spot (spots listed in tag_spots). Since 11 Nov the
  # camera looks straight down, so a spot is in view while the drone is over it (about +-0.4 m
  # in x, +-0.5 m in y at 0.5 m): the zone is centred on the spot. A boxed tag is seen over its
  # 0.15 m walls only from within ~0.3 m of it (any distance on the open side).
  # Not used in known_tags mode, which stops and hovers over each tag instead.
  slow_speed_mps: 0.06    # remove this line to fly at speed_mps everywhere
  slow_before_m: 0.30     # slow zone: from this far short of a spot (x) ... (0.45 with the 45 deg camera)
  slow_after_m: 0.30      # ... to this far past it ... (0.05 with the 45 deg camera)
  slow_halfwidth_m: 0.3   # ... and this far either side of it (y)
  dt_s: 0.1              # firmware holds max 2400 points
  # csv: path/to/t_x_y_z.csv   # optional: fly this file instead of the generated sweep

# Look again: when the camera only glimpses something (1-2 frames, or misread IDs at one
# spot, not near a confirmed tag) and the rest of the path will not bring it back into
# view, pause the sweep, fly (as a trajectory, so the heading and forward camera stay put)
# to look_offset_m short of it in x, hover, then rebuild the rest of the sweep from there.
# Made for the tag boxed in by 0.15 m foam walls: it is visible only from close behind it,
# so a drifting pass often gets 1-2 frames. Each look costs about 10-20 s.
# Remove this section (or enabled: false) to fly exactly as before.
look_again:
  enabled: false          # OFF after 10 Nov 19:48: a single misread (ID 14) near the start triggered a look and
                          # the resume re-flew the route. Re-enable only after fixing that.
  trigger_after_s: 3.0    # look once the glimpse has not been seen for this long ...
  moved_m: 0.6            # ... or the drone is this far from where it last saw it
  offset_m: 0.0           # look point = glimpse minus this in x. 0 since the camera looks straight
                          # down (11 Nov); was 0.30 with the 45 deg forward camera
  hover_s: 5.0            # hover this long at the look point (ends early once confirmed)
  max_looks: 2            # per mission; never the same spot twice
